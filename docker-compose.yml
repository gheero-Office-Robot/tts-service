services:
  tts:
    build: .
    container_name: boa-tts
    restart: unless-stopped
    ports:
      - "11436:8000"
    env_file:
      - .env
    environment:
      TTS_CUDA_DEVICE: ${TTS_CUDA_DEVICE:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    volumes:
      - hf_cache:/models/hf_cache
      - model_cache:/models/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # model loading takes time

volumes:
  hf_cache:
  model_cache:
